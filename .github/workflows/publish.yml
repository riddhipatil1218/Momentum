# publish.yml — runs every time code is pushed to GitHub.
# Step 1 runs the tests. Step 2 publishes the app/ folder to GitHub Pages,
# but ONLY if every test passed, so a broken version never reaches your phone.

name: Test and publish Momentum

on:
  push:
    branches: [main]
  workflow_dispatch:   # adds a "Run workflow" button on GitHub for manual re-publishing

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets the app use the whole iPhone screen, around the notch -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Momentum</title>
  <meta name="description" content="Personal workout, supplement and macro tracker.">

  <!-- Makes "Add to Home Screen" open full screen like a regular app -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Momentum">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#FBF6F0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1C1917" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main id="view" class="view" aria-live="polite"></main>
  <nav id="tab-bar" class="tab-bar" aria-label="Tabs"></nav>
  <script type="module" src="js/main.js"></script>
</body>
</html>
